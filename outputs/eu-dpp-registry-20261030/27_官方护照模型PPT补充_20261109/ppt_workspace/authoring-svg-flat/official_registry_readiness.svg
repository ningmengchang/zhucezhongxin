<g id="supplement-title" data-pptx-bounds="20 10 1240 49"><text x="21.47" y="45.27" font-family="Microsoft YaHei" font-size="32" fill="#000000" font-weight="bold" text-anchor="start" xml:space="preserve">官方规范已发布，完整联调条件仍待确认</text></g><g id="supplement-subtitle" data-pptx-bounds="38 86 1204 43"><text x="38" y="113" font-family="Microsoft YaHei" font-size="22" fill="#556477" font-weight="normal" text-anchor="start" xml:space="preserve">开发依据已具备，完整联调仍待确认。</text></g><g id="released-development-resources" data-pptx-bounds="38 146 572 438"><rect x="38" y="146" width="572" height="42" fill="#4472C4"/><text x="56" y="175" font-family="Microsoft YaHei" font-size="23" fill="#FFFFFF" font-weight="bold" text-anchor="start" xml:space="preserve">已发布的开发依据｜2026.10.30</text><text x="56" y="229" font-family="Microsoft YaHei" font-size="23" fill="#202A37" font-weight="bold" text-anchor="start" xml:space="preserve">接口文档与 OpenAPI</text><text x="56" y="264" font-family="Microsoft YaHei" font-size="21" fill="#202A37" font-weight="normal" text-anchor="start" xml:space="preserve">认证与Token、注册提交、幂等重试，<tspan x="56" dy="29">以及任务状态和逐项结果查询。</tspan></text><text x="56" y="354" font-family="Microsoft YaHei" font-size="23" fill="#202A37" font-weight="bold" text-anchor="start" xml:space="preserve">语义模型 1.0.0</text><text x="56" y="389" font-family="Microsoft YaHei" font-size="21" fill="#202A37" font-weight="normal" text-anchor="start" xml:space="preserve">覆盖EV、LMT、IND的字段结构、类型、<tspan x="56" dy="29">必填、枚举及公开／受限访问视图。</tspan></text><text x="56" y="479" font-family="Microsoft YaHei" font-size="23" fill="#202A37" font-weight="bold" text-anchor="start" xml:space="preserve">校验资源与测试样例</text><text x="56" y="514" font-family="Microsoft YaHei" font-size="21" fill="#202A37" font-weight="normal" text-anchor="start" xml:space="preserve">JSON Schema、SHACL、JSON-LD，<tspan x="56" dy="29">可用于构建本地校验与回归用例。</tspan></text></g><g id="dated-integration-evidence" data-pptx-bounds="634 146 608 438"><rect x="634" y="146" width="608" height="42" fill="#B45309"/><text x="652" y="175" font-family="Microsoft YaHei" font-size="23" fill="#FFFFFF" font-weight="bold" text-anchor="start" xml:space="preserve">内部测试记录｜2026.11.06</text><text x="652" y="224" font-family="Microsoft YaHei" font-size="23" fill="#202A37" font-weight="bold" text-anchor="start" xml:space="preserve">鉴权链路尚待完成验证</text><text x="652" y="256" font-family="Microsoft YaHei" font-size="20" fill="#202A37" font-weight="normal" text-anchor="start" xml:space="preserve">Token地址GET探测返回404；<tspan x="652" dy="28">正式POST取Token待服务账号与凭据具备后验证。</tspan></text><text x="652" y="323" font-family="Microsoft YaHei" font-size="23" fill="#9A3412" font-weight="bold" text-anchor="start" xml:space="preserve">在线语义校验当次不可用</text><image x="648" y="339" width="580" height="213.42" href="../images/eu_semantic_unavailable_20261106.png" preserveAspectRatio="xMidYMid meet"/><text x="652" y="577" font-family="Microsoft YaHei" font-size="16.5" fill="#556477" font-weight="normal" text-anchor="start" xml:space="preserve">正式环境：接收0条、拒绝1条；未完成登记。</text></g><g id="integration-readiness-conclusion" data-pptx-bounds="38 600 1204 63"><rect x="38" y="600" width="1204" height="63" fill="#EAF0F9"/><text x="56" y="639" font-family="Microsoft YaHei" font-size="22" fill="#1F4E79" font-weight="bold" text-anchor="start" xml:space="preserve">当前完整端到端联调尚未完成，具体可联调时间以官方后续通知为准。</text></g><g id="supplement-sources" data-pptx-bounds="38 675 1204 40" data-pptx-role="footer"><text x="38" y="690" font-family="Microsoft YaHei" font-size="12.5" fill="#556477" font-weight="normal" text-anchor="start" xml:space="preserve">来源：欧盟官方资源页（2026.10.30）；刘勇辉《成果报告V1.3》《注册认证指南V1.2》，2026.11.06测试。<tspan x="38" dy="18">官方资料：single-market-economy.ec.europa.eu/single-market/digital-product-passport/resources-documentation_en</tspan></text></g></svg>
