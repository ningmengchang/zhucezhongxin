<text x="578" y="173.32146982" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" data-pptx-text-baseline="metrics-v1">当前可开展工作</text>
<text x="1080" y="173.32146982" text-anchor="middle" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" data-pptx-text-baseline="metrics-v1">准备成果</text>
<text x="53" y="216.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#1F4E79" font-weight="bold" data-pptx-text-baseline="metrics-v1">模型与系统适配</text>
<text x="253" y="216.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#202A37" data-pptx-text-baseline="metrics-v1"><tspan>对齐字段、类型、必填、枚举、单位、多语言及权限；完善录入、动态更</tspan><tspan x="253" dy="24">新规则和业务数据接入。</tspan></text>
<text x="933" y="216.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#202A37" data-pptx-text-baseline="metrics-v1">工程字段映射与模型</text>
<text x="53" y="315.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#1F4E79" font-weight="bold" data-pptx-text-baseline="metrics-v1">欧盟接口开发</text>
<text x="253" y="315.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#202A37" data-pptx-text-baseline="metrics-v1"><tspan>开发私钥签名、Token申请、注册提交及幂等重试；实现任务查询，通过</tspan><tspan x="253" dy="24">Mock验证调用与异常处理。</tspan></text>
<text x="933" y="315.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#202A37" data-pptx-text-baseline="metrics-v1">欧盟接口适配模块；配置及联调用例</text>
<text x="53" y="414.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#1F4E79" font-weight="bold" data-pptx-text-baseline="metrics-v1">本地模型校验</text>
<text x="253" y="414.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#202A37" data-pptx-text-baseline="metrics-v1"><tspan>执行JSON Schema结构校验与SHACL语义约束校验；覆盖三类电池的正向</tspan><tspan x="253" dy="24">样例和负向校验用例。</tspan></text>
<text x="933" y="414.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#202A37" data-pptx-text-baseline="metrics-v1">校验功能、样例及报告</text>
<text x="53" y="513.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#1F4E79" font-weight="bold" data-pptx-text-baseline="metrics-v1">UPI与试点数据</text>
<text x="253" y="513.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#202A37" data-pptx-text-baseline="metrics-v1"><tspan>准备HTTPS护照服务、匿名公开及授权受限视图；实现欧盟回读令牌验签</tspan><tspan x="253" dy="24">与授权，准备单条EV数据。</tspan></text>
<text x="933" y="513.66666667" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="20" fill="#202A37" data-pptx-text-baseline="metrics-v1">UPI与访问控制</text>
