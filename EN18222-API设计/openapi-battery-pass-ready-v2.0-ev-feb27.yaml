      description: EN 18223 public DPP header attributes serialized directly at the DigitalProductPassport root. This is distinct
        from the internal BatteryPass-Ready dppHeader envelope.
    CompressedDigitalProductPassport:
      allOf:
      - $ref: '#/components/schemas/BatteryPassReadyEvFeb27'
      description: 'Canonical writable public representation: flat EN 18223 header plus BatteryPass-Ready batteryPassportData.'
    FullDigitalProductPassport:
      allOf:
      - $ref: '#/components/schemas/DppHeader'
      - type: object
        required:
        - elements
        properties:
          elements:
            type: array
            minItems: 1
            description: Fully expanded DataElement representation of batteryPassportData.
            items:
              $ref: '#/components/schemas/ExpandedDataElement'
      description: Read-only expanded representation. EN 18223 header attributes remain directly at the root; only BatteryPass
        business data is expanded into DataElement objects.
    DigitalProductPassport:
      description: Read response selected by representation=compressed|full.
      oneOf:
      - $ref: '#/components/schemas/CompressedDigitalProductPassport'
      - $ref: '#/components/schemas/FullDigitalProductPassport'
    PartialDigitalProductPassport:
      allOf:
      - $ref: '#/components/schemas/BatteryPassReadyEvFeb27MergePatch'
      description: Backward component name for the compressed BatteryPass merge-patch model.
    ExpandedDataElement:
      oneOf:
      - $ref: '#/components/schemas/DataElementCollection'
      - $ref: '#/components/schemas/SingleValuedDataElement'
      - $ref: '#/components/schemas/MultiValuedDataElement'
      - $ref: '#/components/schemas/RelatedResource'
      - $ref: '#/components/schemas/MultiLanguageDataElement'
      discriminator:
        propertyName: objectType
        mapping:
          DataElementCollection: '#/components/schemas/DataElementCollection'
          SingleValuedDataElement: '#/components/schemas/SingleValuedDataElement'
          MultiValuedDataElement: '#/components/schemas/MultiValuedDataElement'
          RelatedResource: '#/components/schemas/RelatedResource'
          MultiLanguageDataElement: '#/components/schemas/MultiLanguageDataElement'
    DataElementBase:
      type: object
      required:
      - elementId
      - objectType
      properties:
        elementId:
          type: string
          minLength: 1
          description: 在所在容器内唯一；对应绝对路径在整个 DPP 内必须唯一
        objectType:
          type: string
        dictionaryReference:
          type: string
          format: uri
          description: 外部数据字典中语义定义的唯一引用
    DataElementCollection:
      allOf:
      - $ref: '#/components/schemas/DataElementBase'
      - type: object
        required:
        - elements
        properties:
          objectType:
            const: DataElementCollection
          elements:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/ExpandedDataElement'
    SingleValuedDataElement:
      allOf:
      - $ref: '#/components/schemas/DataElementBase'
      - type: object
        required:
        - value
        properties:
          objectType:
            const: SingleValuedDataElement
          valueDataType:
            $ref: '#/components/schemas/XsdValueDataType'
          value:
            description: JSON 原生值；若数据字典未规定类型，可用字符串并提供 valueDataType
    MultiValuedDataElement:
      allOf:
      - $ref: '#/components/schemas/DataElementBase'
      - type: object
        required:
        - value
        properties:
          objectType:
            const: MultiValuedDataElement
          valueDataType:
            $ref: '#/components/schemas/XsdValueDataType'
          value:
            type: array
            minItems: 1
            description: 同一数据类型、保持顺序的 DataElement 列表
            items:
              $ref: '#/components/schemas/ExpandedDataElement'
    RelatedResource:
      allOf:
      - $ref: '#/components/schemas/DataElementBase'
      - type: object
        required:
        - contentType
        - url
        properties:
          objectType:
            const: RelatedResource
          contentType:
            type: string
            minLength: 1
            description: IANA media type，例如 application/pdf
          url:
            type: string
            format: uri
          language:
            $ref: '#/components/schemas/LanguageTag'
          resourceTitle:
            type: string
    MultiLanguageDataElement:
      allOf:
      - $ref: '#/components/schemas/DataElementBase'
      - type: object
        required:
        - value
        properties:
          objectType:
            const: MultiLanguageDataElement
          value:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/MultiLanguageValue'
    MultiLanguageValue:
      type: object
      additionalProperties: false
      required:
      - language
      - value
      properties:
        language:
          $ref: '#/components/schemas/LanguageTag'
        value:
          type: string
    LanguageTag:
      type: string
      minLength: 2
      description: ISO 639 语言代码，可带 EN ISO 3166-1 国家代码，例如 en、en-GB、zh-CN
      pattern: ^[A-Za-z]{2,3}(-[A-Za-z]{2})?$
    XsdValueDataType:
      type: string
      description: |-
        本接口支持的 EN 18223:2026 Table 7 XSD-to-JSON 数据类型集合。
        xsd:base64Binary 为可选支持类型。
      pattern: ^xsd:[A-Za-z][A-Za-z0-9]*$
      enum:
      - xsd:string
      - xsd:boolean
      - xsd:decimal
      - xsd:integer
      - xsd:double
      - xsd:float
      - xsd:date
      - xsd:dateTime
      - xsd:anyURI
      - xsd:base64Binary
      examples:
      - xsd:string
      - xsd:integer
      - xsd:decimal
      - xsd:dateTime
      - xsd:anyURI
