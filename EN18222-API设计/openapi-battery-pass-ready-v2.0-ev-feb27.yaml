  schemas:
    StatusCode:
      type: string
      description: EN 18222 表 15 通用状态码
      enum:
      - Success
      - SuccessCreated
      - SuccessAccepted
      - SuccessNoContent
      - ClientErrorBadRequest
      - ClientNotAuthorized
      - ClientForbidden
      - ClientMethodNotAllowed
      - ClientErrorResourceNotFound
      - ClientResourceConflict
      - ServerInternalError
      - ServerNotImplemented
      - ServerErrorBadGateway
    MessageTypeEnum:
      type: string
      description: EN 18222 表 14
      enum:
      - Info
      - Warning
      - Error
      - Exception
    Message:
      type: object
      additionalProperties: false
      required:
      - messageType
      - text
      properties:
        messageType:
          $ref: '#/components/schemas/MessageTypeEnum'
        text:
          type: string
          minLength: 1
        code:
          type: string
          description: 技术相关的细分状态或错误码
        correlationId:
          type: string
          description: 跨多个系统关联结果消息的标识
        timestamp:
          $ref: '#/components/schemas/UtcTimestamp'
    Result:
      type: object
      description: EN 18222 表 12；标准属性名为单数 message，但基数为 0..*
      additionalProperties: false
      properties:
        message:
          type: array
          items:
            $ref: '#/components/schemas/Message'
    ErrorResponse:
      type: object
      description: 本配置文件把方法 statusCode 与 EN 18222 Result 组合成统一错误响应
      additionalProperties: false
      required:
      - statusCode
      - result
      properties:
        statusCode:
          $ref: '#/components/schemas/StatusCode'
        result:
          $ref: '#/components/schemas/Result'
    Identifier:
      type: string
      minLength: 1
      description: EN 18222/EN 18223 使用的通用标识字符串
    DppIdentifier:
      allOf:
      - $ref: '#/components/schemas/Identifier'
      description: 全局唯一 DPP ID；EN 18223 建议采用 URI/URL 结构，但未强制为单一 URI 方案
    UniqueProductIdentifier:
      allOf:
      - $ref: '#/components/schemas/Identifier'
      description: |-
        符合 EN 18219 的产品唯一标识。由于 EN 18219 允许 URL、Identification Link、DID、DOI、
        RFID/2D 编码方案，不应使用一个自创的通用正则表达式限制全部合法值。
    EconomicOperatorIdentifier:
      allOf:
      - $ref: '#/components/schemas/Identifier'
      description: 符合 EN 18219 经济运营商标识方案的字符串
    FacilityIdentifier:
      allOf:
      - $ref: '#/components/schemas/Identifier'
      description: 符合 EN 18219 设施标识方案的字符串
    UtcTimestamp:
      type: string
      format: date-time
      pattern: Z$
      description: ISO 8601-1 的 UTC 日期时间，必须以 Z 结尾
    Granularity:
      enum:
      - item
      type: string
      x-apifox-enum:
      - value: item
        name: item
        description: ''
      description: EN 18223 scalar granularity; the EV February-2027 profile permits item only.
    DppStatus:
      enum:
      - active
      - archived
      - inactive
      - invalid
      - marked-for-deletion
      type: string
      x-apifox-enum:
      - value: active
        name: active
        description: ''
      - value: archived
        name: archived
        description: ''
      - value: inactive
        name: inactive
        description: ''
      - value: invalid
        name: invalid
        description: ''
      - value: marked-for-deletion
        name: marked-for-deletion
        description: ''
      description: EN 18223 scalar DPP digital-resource status using the BatteryPass-Ready 2.0 code list.
    DppHeader:
      type: object
      properties:
        digitalProductPassportId:
          type: string
          format: uri
          x-AccessRights: "{\r\n\"read\": [ \"public\" ],\r\n\"write\": [ \"economic_operator\", \"third_parties_authorized_by_economic_operator\"\
            \ ]\r\n}"
          title: Unique battery passport identifier / unique DPP identifier
          description: The unique identifier of a battery passport, equivalent to the unique DPP identifier in the JTC-24
            standards
          x-battery-pass-ready:
            attributeNumber: 5
            category: DPP header
            subCategory: Identifier
