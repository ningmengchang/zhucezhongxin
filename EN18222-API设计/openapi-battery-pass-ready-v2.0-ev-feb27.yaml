openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: EN 18222:2026 DPP API — BatteryPass-Ready EV Feb 2027 profile
  version: 1.2.0-battery-pass-ready-2.0-ev-feb27
  description: |-
    面向开发和联调的 EN 18222:2026 REST/HTTPS API 配置文件，集成 BatteryPass-Ready Data Model 2.0 的 EV February 2027 产品数据模型。

    - EN 18222 路径、状态码和生命周期语义继承自初始实施配置文件。
    - 公共 DPP 按 EN 18223 将头部字段直接序列化在根对象；不暴露 dppHeader 包装层。
    - batteryPassportData 保留 BatteryPass-Ready 业务结构；原始双根对象模型仅作为内部映射组件。
    - 创建和更新只接受公共 flat-header compressed JSON。
    - 读取支持 representation=compressed 或 representation=full；full 是从同一 compressed 规范数据生成的 EN 18223 DataElement 表示。
    - BatteryPass-Ready 模型仍为 Work in progress，条件必填必须结合 Data Attribute Longlist v2.0。
    - full 示例中的 dictionaryReference 使用 example.com 占位 URI，不代表欧盟官方数据字典。
  license:
    name: Internal implementation profile; EN standards remain copyrighted
servers:
- url: https://dpp.example.com
  description: DPP custodian / service-provider API
- url: https://registry.example.eu
  description: Registry placeholder; replace with the authoritative Registry endpoint
tags:
- name: Life Cycle API
  description: DPP 主生命周期方法
- name: Fine-grained API
  description: 单个数据元素读写方法
- name: Registry API
  description: DPP 注册方法
paths:
  /v1/dpps/{dppId}:
    parameters:
    - $ref: '#/components/parameters/DppId'
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
      - Life Cycle API
      operationId: readDppById
      x-en18222-method: ReadDPPById
      summary: 按 DPP ID 读取 DPP
      description: |-
        返回指定 DPP ID 对应的 DPP。服务端必须在序列化响应前执行访问控制和字段级过滤。
        此方法属于 EN 18222 要求提供的方法。
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          $ref: '#/components/responses/DppOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
    patch:
      tags:
      - Life Cycle API
      operationId: updateDppById
      x-en18222-method: UpdateDPPById
      summary: 原子化局部更新 DPP
      description: 只接受公共 flat-header compressed RFC 7396 merge patch。先将补丁合并到当前完整 DPP，再按 BatteryPassReadyEvFeb27 校验并原子提交；digitalProductPassportId
        和 uniqueProductIdentifier 不可修改。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/BatteryPassReadyEvFeb27MergePatch'
            examples:
              remainingCapacity:
                summary: Update remaining capacity in Ah
                value:
                  batteryPassportData:
                    PerformanceAndDurability:
                      remainingCapacity:
                        amperehourMiliamperehourValue: 175
                        ampereHourMiliamperehourUnit: Ah
              status:
                summary: Update the DPP digital-resource status
                value:
                  dppStatus: inactive
      responses:
        '200':
          $ref: '#/components/responses/CompressedDppOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      tags:
      - Life Cycle API
      operationId: deleteDppById
      x-en18222-method: DeleteDPPById
      summary: 结束 DPP 的活动生命周期
      description: |-
        删除指定 DPP。实现应采用逻辑删除或归档，而不是抹除 EN 18221 要求保留的历史记录。
        本方法属于 EN 18222 的建议方法。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: DPP 已转为删除/归档状态；响应没有正文
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/dppsByProductId/{productId}:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
      - Life Cycle API
      operationId: readDppByProductId
      x-en18222-method: ReadDPPByProductId
      summary: 按产品唯一标识读取当前有效 DPP
      description: |-
        返回该产品唯一标识对应的当前活动 DPP（最新版本）。产品标识必须符合 EN 18219。
        此方法属于 EN 18222 要求提供的方法。
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          $ref: '#/components/responses/DppOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/dppsByIdAndDate/{dppId}:
    parameters:
    - $ref: '#/components/parameters/DppId'
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
      - Life Cycle API
      operationId: readDppVersionByIdAndDate
      x-en18222-method: ReadDPPVersionByIdAndDate
      summary: 按 DPP ID 和 UTC 时点读取历史版本
      description: |-
        返回在给定 UTC 时点有效的 DPP 版本。选择规则为 validFrom <= date 且
        (validTo 为空或 date < validTo) 的唯一版本；这是本配置文件对标准未细化部分的实施约定。
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: date
        in: query
        required: true
        description: ISO 8601-1 UTC 时间，必须以 Z 结尾
        schema:
          $ref: '#/components/schemas/UtcTimestamp'
        example: '2026-08-27T06:30:00Z'
      - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          $ref: '#/components/responses/DppOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/dppsByProductIds:
    post:
      tags:
      - Life Cycle API
      operationId: readDppIdsByProductIds
      x-en18222-method: ReadDPPIdsByProductIds
      summary: 批量用产品标识发现 DPP ID
      description: |-
        输入非空且不重复的产品唯一标识集合，返回匹配的 DPP ID。EN 18222 提到 limit/cursor，
        但没有定义其 REST 位置和分页对象；本配置文件将它们定义为查询参数和 pagination 响应字段。
        此方法属于 EN 18222 要求提供的方法。
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIdSet'
            example:
            - https://id.example.com/01/09506000134352/21/SN-A10001
            - did:web:example.com:products:SN-A10002
      responses:
        '200':
          description: 查询成功；无匹配时 payload 为空数组
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DppIdsResponse'
              example:
                statusCode: Success
                payload:
                - https://passport.example.com/dpp/018f73c0-9320-7f91-bdc9-2ea86bc98a66
                pagination:
                  limit: 100
                  nextCursor: eyJvZmZzZXQiOjEwMH0
                  hasMore: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/dpps:
    post:
      tags:
      - Life Cycle API
      operationId: createDpp
      x-en18222-method: CreateDPP
      summary: 创建新的 DPP
      description: 创建 EV February 2027 DPP。请求体只接受 EN 18223 根级头部 + BatteryPass-Ready batteryPassportData 的 compressed JSON；不接受
        dppHeader 包装层；完整请求必须通过 BatteryPassReadyEvFeb27 校验。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressedDigitalProductPassport'
            examples:
              evFeb27:
                $ref: '#/components/examples/CompressedBatteryDpp'
      responses:
        '201':
          description: DPP 创建成功
          headers:
            Location:
              description: 新 DPP 资源地址
              schema:
                type: string
                format: uri
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDppResponse'
              example:
                statusCode: SuccessCreated
                digitalProductPassportId: https://passport.example.com/dpp/018f73c0-9320-7f91-bdc9-2ea86bc98a66
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/registerDPP:
    post:
      tags:
      - Registry API
      operationId: registerProductDpp
      x-en18222-method: RegisterProductDPP
      summary: 向 DPP Registry 注册 DPP
      description: |-
        提交 EN 18222 DppRegistryEntry。调用者必须是已验证并获授权的经济运营商或其代理。
        201 表示注册完成并返回 registrationId；202 表示已接收并进入异步验证。
        欧盟委员会实际 Registry 的字段、认证和批量上传规则以其官方技术文档为准。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DppRegistryEntry'
            example:
              uniqueProductIdentifier: https://id.example.com/01/09506000134352/21/SN-A10001
              digitalProductPassportId: https://passport.example.com/dpp/018f73c0-9320-7f91-bdc9-2ea86bc98a66
              uniqueEconomicOperatorIdentifier: iso6523-actorid-upis::0199:example-operator-001
              backupEconomicOperatorIdentifier: iso6523-actorid-upis::0199:example-backup-001
              dppApiEndpoint: https://passport.example.com/v1
      responses:
        '201':
          description: 注册成功并生成唯一注册标识
          headers:
            Location:
              description: 注册记录地址（实施扩展）
              schema:
                type: string
                format: uri
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
              example:
                statusCode: SuccessCreated
                registrationId: urn:eu:dpp:registration:01J6D4M4G3KQ8M7B7X1J15HYTZ
        '202':
          description: 注册请求已接收，尚未完成验证
          headers:
            Location:
              description: 注册请求状态地址；属于实施扩展
              schema:
                type: string
                format: uri
            Retry-After:
              description: 建议再次查询状态的秒数
              schema:
                type: integer
                minimum: 1
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAcceptedResponse'
              example:
                statusCode: SuccessAccepted
                correlationId: 01J6D4KAP9E2WQ0M4X8GZ6VB30
                estimatedCompletionAt: '2026-08-27T06:31:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/dpps/{dppId}/elements/{elementIdPath}:
    parameters:
    - $ref: '#/components/parameters/DppId'
    - $ref: '#/components/parameters/ElementIdPath'
    - $ref: '#/components/parameters/CorrelationId'
    get:
      tags:
      - Fine-grained API
      operationId: readDataElement
      x-en18222-method: ReadDataElement
      summary: 按唯一 JSONPath 读取一个数据元素
      description: |-
        elementIdPath 必须是 RFC 9535 的绝对规范化路径，并且只能定位一个元素；通配符、切片、
        过滤器和递归下降等可能返回多个节点的表达式应拒绝。此方法属于建议方法。
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Representation'
      responses:
        '200':
          description: 数据元素读取成功
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataElementResponse'
              examples:
                compressed:
                  summary: Compressed remainingCapacity object
                  value:
                    statusCode: Success
                    payload:
                      amperehourMiliamperehourValue: 180
                      ampereHourMiliamperehourUnit: Ah
                full:
                  summary: Full remainingCapacity DataElement collection
                  value:
                    statusCode: Success
                    payload:
                      elementId: remainingCapacity
                      dictionaryReference: https://example.com/dictionaries/battery-pass-ready/2.0/ev-feb27/batteryPassportData/PerformanceAndDurability/remainingCapacity
                      objectType: DataElementCollection
                      elements:
                      - elementId: amperehourMiliamperehourValue
                        dictionaryReference: https://example.com/dictionaries/battery-pass-ready/2.0/ev-feb27/batteryPassportData/PerformanceAndDurability/remainingCapacity/amperehourMiliamperehourValue
                        objectType: SingleValuedDataElement
                        valueDataType: xsd:integer
                        value: 180
                      - elementId: ampereHourMiliamperehourUnit
                        dictionaryReference: https://example.com/dictionaries/battery-pass-ready/2.0/ev-feb27/batteryPassportData/PerformanceAndDurability/remainingCapacity/ampereHourMiliamperehourUnit
                        objectType: SingleValuedDataElement
                        valueDataType: xsd:string
                        value: Ah
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
    patch:
      tags:
      - Fine-grained API
      operationId: updateDataElement
      x-en18222-method: UpdateDataElement
      summary: 原子化更新、增补或移除一个数据元素
      description: 只接受目标 BatteryPass-Ready compressed 字段值。目标路径决定实际 Schema；服务端更新后必须校验完整 DPP。JSON null 仅可移除源 Schema 中非 required
        的属性。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              description: Compressed target value or null; validated against the Schema at elementIdPath.
            examples:
              replaceRemainingCapacity:
                value:
                  amperehourMiliamperehourValue: 175
                  ampereHourMiliamperehourUnit: Ah
              removeOptionalElement:
                value: null
      responses:
        '200':
          description: Data element updated successfully; the response payload is the resulting compressed value.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataElementResponse'
              examples:
                remainingCapacity:
                  value:
                    statusCode: Success
                    payload:
                      amperehourMiliamperehourValue: 175
                      ampereHourMiliamperehourUnit: Ah
        '204':
          description: 数据元素已移除；这是本配置文件为移除语义定义的响应
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        实施配置文件采用的认证占位方案。Token 的签发、声明、受众和角色模型应由最终安全规范、
        产品组授权规则及部署环境确定。不得把此占位定义当作欧盟 Registry 的官方认证方案。
  parameters:
    DppId:
      name: dppId
      in: path
      required: true
      description: DPP 唯一标识；放入路径前必须执行 UTF-8 百分号编码
      allowReserved: false
      schema:
        $ref: '#/components/schemas/DppIdentifier'
      example: urn:uuid:018f73c0-9320-7f91-bdc9-2ea86bc98a66
    ProductId:
      name: productId
      in: path
      required: true
      description: EN 18219 产品唯一标识；放入路径前必须执行 UTF-8 百分号编码
      allowReserved: false
      schema:
        $ref: '#/components/schemas/UniqueProductIdentifier'
      example: did:web:example.com:products:SN-A10001
    ElementIdPath:
      name: elementIdPath
      in: path
      required: true
      description: BatteryPass-Ready compressed JSON 的 RFC 9535 绝对规范化路径，只能定位一个元素。
      allowReserved: false
      schema:
        type: string
        minLength: 1
      example: $.batteryPassportData.PerformanceAndDurability.remainingCapacity
    Representation:
      name: representation
      in: query
      required: false
      description: 读取表示方式：compressed 返回 EN 18223 根级头部 + BatteryPass-Ready 业务 JSON；full 保持同一根级头部并返回 DataElement 展开表示。写接口不接受该参数。
      schema:
        type: string
        enum:
        - compressed
        - full
        default: compressed
    Limit:
      name: limit
      in: query
      required: false
      description: 每页最大返回数；100/1000 是本配置文件默认值和上限，不是 EN 18222 的固定值
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: 服务端生成的不透明游标；若提供则不得为空，不得由客户端解析或修改
      schema:
        type: string
        minLength: 1
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: 跨系统跟踪标识；服务端未收到时应生成并在响应中返回
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
